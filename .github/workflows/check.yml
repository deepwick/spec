name: check-port
on:
  workflow_call:
    inputs:
      spec-ref:
        description: deepwick/spec git ref to install the checker from
        type: string
        default: main
jobs:
  check-port:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "deepwick-spec @ git+https://github.com/deepwick/spec@${{ inputs.spec-ref }}"
      - run: check-port .
