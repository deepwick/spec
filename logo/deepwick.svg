<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#081421" /> 
      <stop offset="100%" stop-color="#12233b" /> 
    </linearGradient>
    
    <linearGradient id="tealBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4EC9B0" /> 
      <stop offset="100%" stop-color="#569CD6" /> 
    </linearGradient>
  </defs>
  
  <rect width="500" height="500" rx="110" fill="url(#bg)" />

  <g stroke-linecap="round" stroke-linejoin="round">
    <!-- Bouncy 'd' component -->
    <circle cx="180" cy="290" r="75" fill="none" stroke="#DCDCAA" stroke-width="50" /> 
    <path d="M 255 120 Q 240 280 255 360" fill="none" stroke="#DCDCAA" stroke-width="50" />
    
    <!-- Fluid 'w' component -->
    <path d="M 245 250 C 275 420, 310 380, 325 280 C 340 380, 380 420, 410 230" fill="none" stroke="url(#tealBlue)" stroke-width="50" />
    
    <!-- Syntax color nodes -->
    <circle cx="255" cy="120" r="25" fill="#CE9178" />
    <circle cx="410" cy="230" r="25" fill="#57A64A" />
  </g>
</svg>
